<title>Quark Asset Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen&family=Barlow:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the game's own look (dark navy panels, cyan accent, pixel display face). A category rail on the left,
   a grid of asset tiles, and a drawer with the viewer + upload for the one you open. One deliberate dark theme. */
:root {
  --bg: #0a0f15; --panel: #111922; --panel2: #16212c; --line: #213041; --fg: #dbe6f0; --muted: #7b90a5;
  --accent: #39d3ff; --accent-ink: #04212c; --replaced: #ffb547; --ingame: #5be39a; --danger: #ff6b6b;
  --display: "Silkscreen", "Courier New", monospace; --body: "Barlow", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--body); }
button, input, textarea, select { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
.app { display: grid; grid-template-columns: 220px minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); height: 100%; }
header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; padding-block: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 2px solid var(--accent); background: var(--panel); }
.brand { font: 22px/1 var(--display); color: var(--accent); letter-spacing: .04em; white-space: nowrap }
.brand small { display: block; font: 11px/1.3 var(--mono); color: var(--muted); letter-spacing: .08em; margin-top: 4px }
.tally { display: flex; gap: 18px; font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; flex-wrap: wrap }
.tally b { font-weight: 500; color: var(--fg) }
.tally .r b { color: var(--replaced) } .tally .g b { color: var(--ingame) }
.search { margin-left: auto; flex: 1 1 220px; max-width: 360px }
.search input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px }
nav { border-right: 1px solid var(--line); overflow-y: auto; padding: 14px 10px; background: var(--panel) }
nav h3 { font: 11px var(--mono); letter-spacing: .12em; color: var(--muted); margin: 14px 8px 6px; text-transform: uppercase }
nav button { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; width: 100%; text-align: left;
  background: none; border: 0; border-radius: 4px; padding: 7px 8px; font-size: 14px }
nav button:hover { background: var(--panel2) }
nav button[aria-current="true"] { background: var(--accent); color: var(--accent-ink) }
nav .n { font: 12px var(--mono); opacity: .75; font-variant-numeric: tabular-nums }
nav .n i { font-style: normal; color: var(--replaced) }
nav button[aria-current="true"] .n i { color: var(--accent-ink) }
main { overflow-y: auto; padding-block: 18px 40px; padding-left: 20px; padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.lead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 8px 16px; margin-bottom: 14px }
.lead h1 { font: 20px/1.1 var(--display); margin: 0; letter-spacing: .03em }
.lead p { margin: 0; color: var(--muted); font-size: 13px; max-width: 62ch }
.filters { display: flex; gap: 6px; flex-wrap: wrap }
.chipbtn { background: var(--panel); border: 1px solid var(--line); border-radius: 99px; padding: 4px 11px; font: 12px var(--mono) }
.chipbtn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent) }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px }
.tile { display: flex; flex-direction: column; gap: 8px; text-align: left; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 10px; min-width: 0 }
.tile:hover { border-color: #33485e }
.tile .thumb { height: 104px; border-radius: 4px; background: var(--bg); display: grid; place-items: center; overflow: hidden; position: relative }
.tile .thumb img { width: 100%; height: 100%; object-fit: cover; image-rendering: auto }
.tile .thumb canvas { width: 100%; height: 100% }
.tile .thumb .glyph { font: 28px var(--display); color: #2c4257 }
.tile .name { font: 500 14px var(--body); overflow-wrap: anywhere }
.tile .meta { display: flex; justify-content: space-between; gap: 6px; align-items: center; font: 11px var(--mono); color: var(--muted) }
.state { font: 10px/1 var(--mono); letter-spacing: .06em; padding: 4px 6px; border-radius: 3px; white-space: nowrap;
  border: 1px solid var(--line); color: var(--muted) }
.state.waiting { border-color: var(--replaced); color: var(--replaced) }
.state.ingame { border-color: var(--ingame); color: var(--ingame) }
.empty { color: var(--muted); padding: 30px 0 }
.kitrow { display: flex; gap: 6px; flex-wrap: wrap; margin: 0 0 12px }
/* the drawer */
.drawer { position: fixed; inset: 0 0 0 auto; width: min(760px, 100%); background: var(--panel); border-left: 2px solid var(--accent);
  display: grid; grid-template-rows: auto minmax(0, 1fr); z-index: 20; box-shadow: -20px 0 50px #0008;
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); padding-right: env(safe-area-inset-right, 0px) }
.drawer .top { display: flex; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line) }
.drawer .top h2 { font: 18px/1.15 var(--display); margin: 0; flex: 1; min-width: 0; overflow-wrap: anywhere }
.drawer .top .id { display: block; font: 11px var(--mono); color: var(--muted); margin-top: 4px }
.x { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 6px 12px }
.body { overflow-y: auto; padding: 16px 18px 30px; display: flex; flex-direction: column; gap: 18px }
.desc { color: var(--muted); margin: 0; font-size: 14px }
.compare { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px }
.pane { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-width: 0 }
.pane h4 { margin: 0; font: 11px var(--mono); letter-spacing: .1em; color: var(--muted); text-transform: uppercase; display: flex; justify-content: space-between; gap: 8px }
.pane.mine { border-color: var(--replaced) }
.pane.mine h4 { color: var(--replaced) }
.view3d { width: 100%; aspect-ratio: 4 / 3; max-width: 100%; border-radius: 4px; background: radial-gradient(ellipse at 50% 35%, #172433, #070b10); display: block; touch-action: none }
.wave { width: 100%; height: 90px; display: block }
.pane img { width: 100%; border-radius: 4px; background: repeating-conic-gradient(#141c25 0 25%, #0e151d 0 50%) 0 0 / 16px 16px }
.fontsample { font-size: 30px; line-height: 1.2; overflow-wrap: anywhere }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center }
.btn { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 7px 12px; font-size: 14px }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600 }
.btn.warn { color: var(--danger); border-color: #5a2a2e }
.btn:disabled { opacity: .45; cursor: default }
.drop { border: 2px dashed #2d4256; border-radius: 6px; padding: 18px; text-align: center; color: var(--muted); display: flex; flex-direction: column; gap: 10px; align-items: center }
.drop.over { border-color: var(--accent); color: var(--fg) }
.drop strong { color: var(--fg); font-weight: 600 }
label.small { font: 11px var(--mono); color: var(--muted); letter-spacing: .08em; text-transform: uppercase }
textarea { width: 100%; min-height: 60px; background: var(--bg); border: 1px solid var(--line); border-radius: 4px; padding: 8px }
.note { font-size: 13px; color: var(--muted); margin: 0 }
.msg { font-size: 13px; margin: 0 }
.msg.err { color: var(--danger) } .msg.ok { color: var(--ingame) }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; font-size: 13px }
.toolbar .btn { padding: 4px 9px; font-size: 12px }
pre.data { margin: 0; max-height: 360px; overflow: auto; font: 12px/1.5 var(--mono); background: var(--bg); padding: 10px; border-radius: 4px }
.scrim { position: fixed; inset: 0; background: #0009; z-index: 19 }
@media (max-width: 760px) {
  .app { grid-template-columns: 1fr; grid-template-rows: auto auto minmax(0, 1fr) }
  nav { border-right: 0; border-bottom: 1px solid var(--line); display: flex; overflow-x: auto; gap: 4px; padding: 8px }
  nav h3 { display: none }
  nav button { width: auto; white-space: nowrap }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)) }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

<div class="app">
  <header>
    <div class="brand">QUARK ASSET STUDIO<small id="ver">LOADING THE GAME'S ASSETS…</small></div>
    <div class="tally" id="tally"></div>
    <div class="search"><input id="q" type="search" placeholder="Search assets (rocket, temple, step…)" aria-label="Search assets"></div>
  </header>
  <nav id="nav" aria-label="Asset categories"></nav>
  <main id="main"><p class="empty">Loading…</p></main>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-label="Asset details"></aside>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script>
"use strict";
// ---------------------------------------------------------------------------------------------------------------
// Data: manifest.json (published with the page: every default asset of the game) + the owner's uploads, kept in
// the page's database ("replacements", one doc per asset) and asset store (the file, wrapped as JSON text). At each
// game update Claude reads the replacements, puts the files into the game as its new defaults, and marks them shipped.
// ---------------------------------------------------------------------------------------------------------------
const KIND_ACCEPT = {
  sound: ".wav,.ogg,.mp3,.flac", model: ".glb,.gltf", map: ".qmap", image: ".png,.jpg,.jpeg",
  font: ".ttf,.otf", data: ".json",
};
const KIND_HINT = {
  sound: "WAV, OGG, MP3 or FLAC. Start the sound right away (no silence first); keep it short.",
  model: "glTF (.glb or .gltf), Y up, metres, same size and origin as the default (spin both to compare). Name a material \"team\" to have it tinted with the team colour.",
  map: "A .qmap file (the map editor saves these). It replaces the generated map of the same name.",
  image: "PNG or JPG, ideally the same size as the default.",
  font: "TTF or OTF: a static font in the weight to show (RUBIK: the default UI font, Rubik Bold; WORK SANS: that entry of Settings > FONT, Work Sans Bold). The game builds its text atlas from it, sized to Rubik's capitals.",
  data: "JSON in the same shape as the default.",
};
const CAT_ORDER = ["Sounds", "Voices", "Models", "Maps", "Images", "Fonts", "Website", "Data"];
const S = { items: [], version: "", cat: null, kit: "all", q: "", only: "all", repl: {}, db: null, assets: null, user: null, open: null };
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const keyOf = (id) => id.replace(/[^A-Za-z0-9_-]/g, "__");

function stateOf(it) {
  const r = S.repl[it.id];
  if (r && r.status === "shipped") return { cls: "ingame", label: "YOURS · IN GAME" };
  if (r) return { cls: "waiting", label: "YOURS · NEXT UPDATE" };
  if (it.owner) return { cls: "ingame", label: "YOURS · IN GAME" };
  return { cls: "", label: "DEFAULT" };
}
const isReplaced = (it) => !!S.repl[it.id] || !!it.owner;

// ---------- boot
(async function boot() {
  try {
    const m = await (await fetch("manifest.json")).json();
    S.items = m.items; S.version = m.version;
  } catch (e) { $("#main").innerHTML = '<p class="empty">Couldn\'t load the asset list (manifest.json).</p>'; return; }
  const cats = CAT_ORDER.filter((c) => S.items.some((i) => i.category === c)).concat([...new Set(S.items.map((i) => i.category))].filter((c) => !CAT_ORDER.includes(c)));
  S.cats = cats;
  try { const h = (location.hash || "").slice(1); S.cat = cats.find((c) => c.toLowerCase() === h) || null; } catch (e) {}
  S.cat = S.cat || cats[0];
  render();
  // the database + asset store light up when the viewer can use them
  if (window.claude && claude.use) {
    const [db, assets, user] = await Promise.all([claude.use("db"), claude.use("assets"), claude.use("user")]);
    S.db = db; S.assets = assets; S.user = user;
    if (db) db.collection("replacements").onSnapshot((snap) => {
      S.repl = {};
      snap.docs.forEach((d) => { const v = d.data(); if (v && v.assetId) S.repl[v.assetId] = v; });
      render(); if (S.open) openAsset(S.open, true);
    }, () => {});
    render(); if (S.open) openAsset(S.open, true);
  }
})();

// ---------- the rail, the grid
function render() {
  $("#ver").textContent = "GAME VERSION " + S.version + " · " + S.items.length + " ASSETS";
  const mine = S.items.filter(isReplaced).length, waiting = S.items.filter((i) => S.repl[i.id] && S.repl[i.id].status !== "shipped").length;
  $("#tally").innerHTML = `<span><b>${S.items.length - mine}</b> default</span><span class="r"><b>${waiting}</b> waiting for the next update</span><span class="g"><b>${mine - waiting}</b> yours in the game</span>`;
  const nav = $("#nav");
  nav.innerHTML = "<h3>Assets</h3>" + S.cats.map((c) => {
    const its = S.items.filter((i) => i.category === c), r = its.filter(isReplaced).length;
    return `<button data-cat="${esc(c)}" aria-current="${c === S.cat}">${esc(c)}<span class="n">${r ? `<i>${r}</i> / ` : ""}${its.length}</span></button>`;
  }).join("");
  nav.querySelectorAll("button").forEach((b) => b.onclick = () => { S.cat = b.dataset.cat; S.kit = "all"; render(); });
  const q = S.q.trim().toLowerCase();
  let list = S.items.filter((i) => q ? (i.name + " " + i.id + " " + (i.desc || "")).toLowerCase().includes(q) : i.category === S.cat);
  const kits = [...new Set(list.map((i) => i.kit).filter(Boolean))];
  if (S.kit !== "all") list = list.filter((i) => i.kit === S.kit);
  if (S.only === "mine") list = list.filter(isReplaced); else if (S.only === "default") list = list.filter((i) => !isReplaced(i));
  const main = $("#main");
  main.innerHTML = `<div class="lead"><div><h1>${q ? "SEARCH" : esc(S.cat.toUpperCase())}</h1><p>${q ? list.length + " matching assets" : catBlurb(S.cat)}</p></div>
    <div class="filters" role="group" aria-label="Show">${[["all", "All"], ["default", "Still default"], ["mine", "Yours"]].map(([k, l]) => `<button class="chipbtn" data-only="${k}" aria-pressed="${S.only === k}">${l}</button>`).join("")}</div></div>
    ${kits.length > 1 ? `<div class="kitrow" role="group" aria-label="Kit">${["all", ...kits].map((k) => `<button class="chipbtn" data-kit="${esc(k)}" aria-pressed="${S.kit === k}">${k === "all" ? "Every kit" : esc(k.replace(/_/g, " ").toUpperCase())}</button>`).join("")}</div>` : ""}
    <div class="grid">${list.map(tile).join("") || '<p class="empty">Nothing here yet.</p>'}</div>`;
  main.querySelectorAll("[data-only]").forEach((b) => b.onclick = () => { S.only = b.dataset.only; render(); });
  main.querySelectorAll("[data-kit]").forEach((b) => b.onclick = () => { S.kit = b.dataset.kit; render(); });
  main.querySelectorAll(".tile").forEach((t) => t.onclick = () => openAsset(t.dataset.id));
  main.querySelectorAll("canvas[data-wave]").forEach((c) => drawWaveFromUrl(c, c.dataset.wave));
}
function catBlurb(c) {
  return ({ Sounds: "Every sound effect, in every sound kit. Play one, then upload yours to replace it.",
    Voices: "The announcer lines for each voice.", Models: "Player models, weapons, projectiles. Open one to spin it around.",
    Maps: "Every map. Open one to fly around it; upload a .qmap to replace it.", Images: "Icons and artwork.",
    Fonts: "The game's fonts.", Website: "Pictures on the website.", Data: "Colour palettes and other tables." })[c] || "";
}
function tile(it) {
  const st = stateOf(it);
  let thumb = `<span class="glyph">${esc((it.kind || "?").slice(0, 3).toUpperCase())}</span>`;
  if (it.kind === "image") thumb = `<img loading="lazy" src="${esc(it.file)}" alt="">`;
  else if (it.kind === "sound") thumb = `<canvas data-wave="${esc(it.file)}" width="340" height="180" aria-hidden="true"></canvas>`;
  return `<button class="tile" data-id="${esc(it.id)}"><div class="thumb">${thumb}</div><div class="name">${esc(it.name)}</div>
    <div class="meta"><span>${esc(it.kit ? it.kit.replace(/_/g, " ") : it.kind)}</span><span class="state ${st.cls}">${st.label}</span></div></button>`;
}
$("#q").addEventListener("input", (e) => { S.q = e.target.value; render(); });

// ---------- waveform thumbnails (decoded once, cached)
const audioCtx = () => (S.ac = S.ac || new (window.AudioContext || window.webkitAudioContext)());
const waveCache = new Map();
async function decodeUrl(url) {
  if (!waveCache.has(url)) waveCache.set(url, fetch(url).then((r) => r.arrayBuffer()).then((b) => audioCtx().decodeAudioData(b)));
  return waveCache.get(url);
}
async function drawWaveFromUrl(cv, url) { try { drawWave(cv, await decodeUrl(url)); } catch (e) {} }
function drawWave(cv, buf, color = "#39d3ff") {
  const g = cv.getContext("2d"), w = cv.width, h = cv.height, d = buf.getChannelData(0), step = Math.max(1, Math.floor(d.length / w));
  g.clearRect(0, 0, w, h); g.fillStyle = color;
  for (let x = 0; x < w; x++) {
    let mn = 1, mx = -1;
    for (let i = x * step; i < Math.min(d.length, (x + 1) * step); i++) { const v = d[i]; if (v < mn) mn = v; if (v > mx) mx = v; }
    if (mx < mn) continue;
    g.fillRect(x, (1 - mx) * h / 2, 1, Math.max(1, (mx - mn) * h / 2));
  }
}
function playBuf(buf) {
  const ac = audioCtx(); if (ac.state === "suspended") ac.resume();
  const s = ac.createBufferSource(); s.buffer = buf; s.connect(ac.destination); s.start();
}

// ---------- the drawer: viewer for the default + your version, and the upload
const viewers = [];
function closeDrawer() { viewers.splice(0).forEach((v) => v.dispose && v.dispose()); $("#drawer").hidden = true; $("#scrim").hidden = true; S.open = null; }
$("#scrim").onclick = closeDrawer;
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && S.open) closeDrawer(); });

async function openAsset(id, refresh) {
  const it = S.items.find((i) => i.id === id); if (!it) return;
  if (refresh && $("#drawer").hidden) return;
  S.open = id;
  viewers.splice(0).forEach((v) => v.dispose && v.dispose());
  const r = S.repl[id], st = stateOf(it), canUpload = !!(S.db && S.assets);
  const dr = $("#drawer");
  dr.innerHTML = `<div class="top"><h2>${esc(it.name)}<span class="id">${esc(it.id)} · ${esc(it.file)}</span></h2><span class="state ${st.cls}">${st.label}</span><button class="x" id="close">Close</button></div>
  <div class="body">
    ${it.desc ? `<p class="desc">${esc(it.desc)}</p>` : ""}
    <div class="compare"><div class="pane" id="paneDefault"><h4><span>${it.owner ? "In the game (yours)" : "Default (in the game now)"}</span></h4></div>
      ${r ? `<div class="pane mine" id="paneMine"><h4><span>Your version</span><span>${r.status === "shipped" ? "in the game" : "goes in next update"}</span></h4></div>` : ""}</div>
    ${r && r.note ? `<p class="note">Your note: ${esc(r.note)}</p>` : ""}
    <section class="pane" aria-label="Upload a replacement">
      <h4><span>${r ? "Replace your version" : "Upload your version"}</span><span>${esc(KIND_ACCEPT[it.kind] || "")}</span></h4>
      ${canUpload ? `<div class="drop" id="drop"><strong>Drop a file here</strong><span>${esc(KIND_HINT[it.kind] || "")}</span>
        <label class="btn" for="file">Choose a file</label><input id="file" type="file" accept="${esc(KIND_ACCEPT[it.kind] || "")}" hidden></div>
        <label class="small" for="noteIn">Note for the next update (optional)</label><textarea id="noteIn" placeholder="e.g. louder than the old one, keep the pitch"></textarea>
        <p class="msg" id="msg" role="status"></p>
        ${r ? `<div class="row"><button class="btn warn" id="remove">Remove my version (keep the default)</button></div>` : ""}`
      : `<p class="note">Uploading needs editor access to this page. You can still preview everything.</p>`}
    </section>
  </div>`;
  dr.hidden = false; $("#scrim").hidden = false;
  $("#close").onclick = closeDrawer;
  mountViewer($("#paneDefault"), it, it.file);
  if (r) mountMine($("#paneMine"), it, r);
  if (canUpload) wireUpload(it);
}

async function mountMine(pane, it, r) {
  try {
    const wrap = await (await fetch(r.assetUrl || "/_blob/" + r.assetBlobId)).json();
    const bytes = Uint8Array.from(atob(wrap.data), (c) => c.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], { type: wrap.mime || "application/octet-stream" }));
    viewers.push({ dispose: () => URL.revokeObjectURL(url) });
    mountViewer(pane, it, url, wrap.filename);
  } catch (e) { pane.insertAdjacentHTML("beforeend", '<p class="msg err">Couldn\'t load your upload for preview.</p>'); }
}

function mountViewer(pane, it, url, fname) {
  const k = it.kind;
  if (k === "sound") {
    pane.insertAdjacentHTML("beforeend", `<canvas class="wave" width="700" height="180" aria-label="Waveform"></canvas><div class="row"><button class="btn primary">Play</button><span class="note"></span></div>`);
    const cv = pane.querySelector("canvas"), info = pane.querySelector(".note");
    decodeUrl(url).then((buf) => { drawWave(cv, buf, pane.classList.contains("mine") ? "#ffb547" : "#39d3ff"); info.textContent = buf.duration.toFixed(2) + " s · " + buf.sampleRate + " Hz"; pane.querySelector("button").onclick = () => playBuf(buf); })
      .catch(() => { info.textContent = "Can't decode this file in the browser."; });
  } else if (k === "image") {
    pane.insertAdjacentHTML("beforeend", `<img alt="${esc(it.name)}"><span class="note"></span>`);
    const img = pane.querySelector("img"); img.onload = () => pane.querySelector(".note").textContent = img.naturalWidth + " × " + img.naturalHeight + " px"; img.src = url;
  } else if (k === "font") {
    if (/\.png$/i.test(fname || it.file)) { pane.insertAdjacentHTML("beforeend", `<img alt="Font atlas" style="image-rendering:pixelated">`); pane.querySelector("img").src = url; return; }
    const fam = "f" + Math.random().toString(36).slice(2);
    new FontFace(fam, `url(${url})`).load().then((f) => { document.fonts.add(f); pane.insertAdjacentHTML("beforeend", `<div class="fontsample" style="font-family:${fam}">QUARK 1234567890<br>The quick brown fox jumps over the lazy dog</div>`); })
      .catch(() => pane.insertAdjacentHTML("beforeend", '<p class="msg err">Can\'t load this font.</p>'));
  } else if (k === "model" || k === "map") {
    const cv = document.createElement("canvas"); cv.className = "view3d"; pane.appendChild(cv);
    const bar = document.createElement("div"); bar.className = "toolbar"; pane.appendChild(bar);
    const v = k === "model" ? modelViewer(cv, bar, url) : mapViewer(cv, bar, url);
    viewers.push(v);
  } else {
    pane.insertAdjacentHTML("beforeend", `<pre class="data">Loading…</pre>`);
    fetch(url).then((r) => r.text()).then((t) => pane.querySelector("pre").textContent = t.slice(0, 20000));
  }
}

// ---------- 3D: one small three.js scene per pane (orbit with the mouse / a finger, wheel to zoom)
function scene3d(cv, bar) {
  if (!window.THREE || !THREE.OrbitControls) { cv.replaceWith(Object.assign(document.createElement("p"), { className: "msg err", textContent: "The 3D viewer didn't load (no connection to its library)." })); return null; }
  const rd = new THREE.WebGLRenderer({ canvas: cv, antialias: true, alpha: true });
  rd.setPixelRatio(Math.min(2, devicePixelRatio || 1));
  const sc = new THREE.Scene(), cam = new THREE.PerspectiveCamera(45, 4 / 3, 0.01, 5000);
  sc.add(new THREE.HemisphereLight(0xdfefff, 0x23303d, 1.1));
  const sun = new THREE.DirectionalLight(0xffffff, 1.0); sun.position.set(3, 6, 4); sc.add(sun);
  const ctl = new THREE.OrbitControls(cam, cv); ctl.enableDamping = true;
  let raf = 0, spin = true;
  const fit = () => { const w = cv.clientWidth, h = cv.clientHeight; if (w && h) { rd.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); } };
  const ro = new ResizeObserver(fit); ro.observe(cv); fit();
  const loop = () => { raf = requestAnimationFrame(loop); if (spin) ctl.autoRotate = true; ctl.update(); rd.render(sc, cam); };
  loop();
  cv.addEventListener("pointerdown", () => { spin = false; ctl.autoRotate = false; });
  const frame = (obj, dist = 1.6) => {
    const b = new THREE.Box3().setFromObject(obj), c = b.getCenter(new THREE.Vector3()), s = b.getSize(new THREE.Vector3()).length() || 1;
    ctl.target.copy(c); cam.position.copy(c).add(new THREE.Vector3(0.6, 0.45, 1).normalize().multiplyScalar(s * dist)); cam.near = s / 500; cam.far = s * 50; cam.updateProjectionMatrix();
  };
  const btn = (label, fn) => { const b = document.createElement("button"); b.className = "btn"; b.textContent = label; b.onclick = fn; bar.appendChild(b); return b; };
  btn("Spin", () => { spin = !spin; ctl.autoRotate = spin; });
  return { rd, sc, cam, ctl, frame, btn, dispose: () => { cancelAnimationFrame(raf); ro.disconnect(); ctl.dispose(); rd.dispose(); } };
}
function modelViewer(cv, bar, url) {
  const v = scene3d(cv, bar); if (!v) return {};
  const grid = new THREE.GridHelper(4, 16, 0x2c4257, 0x1a2633); v.sc.add(grid);
  const teams = [["Blue team", 0x3a8dff], ["Red team", 0xff5a4a], ["Neutral", 0xb9c4cf]];
  let model = null, team = 0;
  const tint = () => model && model.traverse((o) => { if (o.material && /team/i.test(o.material.name || "")) o.material.color.setHex(teams[team][1]); });
  const tb = v.btn("Colour: " + teams[0][0], () => { team = (team + 1) % teams.length; tb.textContent = "Colour: " + teams[team][0]; tint(); });
  v.btn("Front", () => { if (model) v.frame(model); });
  new THREE.GLTFLoader().load(url, (g) => {
    model = g.scene; v.sc.add(model); tint();
    const b = new THREE.Box3().setFromObject(model); grid.position.y = b.min.y; v.frame(model);
    const s = b.getSize(new THREE.Vector3());
    bar.insertAdjacentHTML("beforeend", `<span class="note">${s.x.toFixed(2)} × ${s.y.toFixed(2)} × ${s.z.toFixed(2)} m</span>`);
  }, undefined, () => bar.insertAdjacentHTML("beforeend", '<span class="msg err">Couldn\'t read this model.</span>'));
  return v;
}
// a .qmap: boxes by material, spawns as markers
const MAT_COL = { box: 0x8c96a3, accent: 0x5f7fa0, wallbang: 0x3b4048, metal: 0x9aa7b4, glow: 0x9ff0ff, far: 0x4a5560, water: 0x2f74c8, lava: 0xff6a1f, trim: 0x6d8fb0, ladder: 0xb08a55 };
function mapViewer(cv, bar, url) {
  const v = scene3d(cv, bar); if (!v) return {};
  let showFar = false, group = new THREE.Group(); v.sc.add(group);
  let text = "";
  const build = () => {
    v.sc.remove(group); group = new THREE.Group(); v.sc.add(group);
    const byMat = {}, spawns = [];
    for (const line of text.split("\n")) {
      const w = line.trim().split(/\s+/);
      if (MAT_COL[w[0]] !== undefined && w.length >= 7) {
        if (w[0] === "far" && !showFar) continue;
        const n = w.slice(1, 7).map(Number); if (n.some(isNaN)) continue;
        (byMat[w[0]] = byMat[w[0]] || []).push(n);
      } else if (w[0] === "spawn" && w.length >= 5) spawns.push([+w[2], +w[3], +w[4]]);
    }
    const geo = new THREE.BoxGeometry(1, 1, 1), m4 = new THREE.Matrix4();
    for (const [mat, boxes] of Object.entries(byMat)) {
      const transparent = mat === "water" || mat === "lava";
      const material = new THREE.MeshLambertMaterial({ color: MAT_COL[mat], transparent, opacity: transparent ? 0.75 : 1, emissive: mat === "glow" || mat === "lava" ? MAT_COL[mat] : 0x000000, emissiveIntensity: 0.6 });
      const mesh = new THREE.InstancedMesh(geo, material, boxes.length);
      boxes.forEach((b, i) => { m4.makeScale(Math.max(.01, b[3] - b[0]), Math.max(.01, b[4] - b[1]), Math.max(.01, b[5] - b[2])); m4.setPosition((b[0] + b[3]) / 2, (b[1] + b[4]) / 2, (b[2] + b[5]) / 2); mesh.setMatrixAt(i, m4); });
      group.add(mesh);
    }
    const sg = new THREE.ConeGeometry(0.5, 1.6, 8), sm = new THREE.MeshBasicMaterial({ color: 0xffb547 });
    spawns.forEach((p) => { const c = new THREE.Mesh(sg, sm); c.position.set(p[0], p[1] + 0.8, p[2]); group.add(c); });
    return { boxes: Object.values(byMat).reduce((a, b) => a + b.length, 0), spawns: spawns.length };
  };
  const info = document.createElement("span"); info.className = "note";
  v.btn("Distant scenery", () => { showFar = !showFar; build(); });
  v.btn("Overview", () => v.frame(group, 1.1));
  bar.appendChild(info);
  fetch(url).then((r) => r.text()).then((t) => { text = t; const n = build(); v.frame(group, 1.1); info.textContent = n.boxes + " blocks · " + n.spawns + " spawns (yellow)"; })
    .catch(() => info.textContent = "Couldn't read this map.");
  return v;
}

// ---------- upload: the file goes into the asset store wrapped as JSON (the store takes text, not audio / models),
// and a "replacements" doc records it for the next update
function wireUpload(it) {
  const drop = $("#drop"), input = $("#file"), msg = $("#msg");
  const say = (t, cls = "") => { msg.textContent = t; msg.className = "msg " + cls; };
  drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
  drop.addEventListener("dragleave", () => drop.classList.remove("over"));
  drop.addEventListener("drop", (e) => { e.preventDefault(); drop.classList.remove("over"); if (e.dataTransfer.files[0]) send(e.dataTransfer.files[0]); });
  input.addEventListener("change", () => input.files[0] && send(input.files[0]));
  const rm = $("#remove");
  if (rm) rm.onclick = async () => {
    if (rm.dataset.armed !== "1") { rm.dataset.armed = "1"; rm.textContent = "Click again to remove it"; return; }
    try { await S.db.collection("replacements").doc(keyOf(it.id)).delete(); say("Removed. The default stays.", "ok"); } catch (e) { say("Couldn't remove it: " + (e.message || e.code), "err"); }
  };
  async function send(file) {
    const ext = "." + (file.name.split(".").pop() || "").toLowerCase();
    if (!(KIND_ACCEPT[it.kind] || "").split(",").includes(ext)) { say(`That's a ${ext} file. This asset takes ${KIND_ACCEPT[it.kind]}.`, "err"); return; }
    if (file.size > 14 * 1024 * 1024) { say("That file is over 14 MB. Make it smaller (shorter, or compressed) and try again.", "err"); return; }
    say("Uploading " + file.name + "…");
    try {
      const b64 = await new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1] || ""); fr.onerror = rej; fr.readAsDataURL(file); });
      const wrap = JSON.stringify({ quarkAsset: 1, assetId: it.id, target: it.file, filename: file.name, mime: file.type || "application/octet-stream", size: file.size, data: b64 });
      const up = await S.assets.upload(new Blob([wrap], { type: "application/json" }), { type: "application/json" });
      let by = ""; try { by = S.user && S.user.id ? await S.user.id() : ""; } catch (e) {}
      await S.db.collection("replacements").doc(keyOf(it.id)).set({ assetId: it.id, target: it.file, kind: it.kind, assetBlobId: up.id, assetUrl: up.url,
        filename: file.name, mime: file.type || "", size: file.size, note: ($("#noteIn").value || "").slice(0, 500), uploadedAt: Date.now(), by, status: "waiting" });
      say("Uploaded. It goes into the game with the next update.", "ok");
    } catch (e) { say("Upload failed: " + (e.message || e.code || e) + ". Try again, or a smaller file.", "err"); }
  }
}
