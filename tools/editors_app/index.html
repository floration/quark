<!doctype html>
<html><head><meta charset="utf-8"><title>Quarkology Editors</title>
<style>
  :root { --bg:#15171c; --bar:#1d2027; --fg:#e6e8ee; --dim:#9aa0ad; --acc:#4da3ff; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px system-ui, sans-serif; }
  #bar { display:flex; align-items:center; gap:2px; height:38px; padding:0 8px; background:var(--bar); }
  #bar b { margin-right:12px; }
  .tab { padding:8px 14px; border-radius:6px; cursor:pointer; color:var(--dim); user-select:none; }
  .tab.on { background:var(--bg); color:var(--fg); }
  .tab .dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#666; margin-right:6px; }
  .tab .dot.up { background:#3fbf6f; }
  #saves { margin-left:auto; padding:6px 12px; border:0; border-radius:6px; background:var(--acc); color:#fff; cursor:pointer; }
  #views { position:absolute; inset:38px 0 0 0; }
  iframe { position:absolute; inset:0; width:100%; height:100%; border:0; display:none; background:var(--bg); }
  iframe.on { display:block; }
  #wait { position:absolute; inset:38px 0 0 0; display:none; align-items:center; justify-content:center; color:var(--dim); }
</style></head>
<body>
<div id="bar"><b>Quarkology Editors</b><span id="list" style="display:flex;gap:2px"></span>
  <button id="saves" title="Your saved work. Zip this folder and send it to q.">Open my saves</button></div>
<div id="views"></div><div id="wait">Starting the editor...</div>
<script>
(async () => {
  const { tabs, saves } = await window.editors.tabs();
  document.getElementById('saves').title = saves + '\nZip this folder and send it to q.';
  document.getElementById('saves').onclick = () => window.editors.openSaves();
  const list = document.getElementById('list'), views = document.getElementById('views'), wait = document.getElementById('wait');
  const up = {}, frames = {};
  let current = null;
  const alive = (t) => !t.probe ? Promise.resolve(true)
    : fetch(t.probe, { mode: 'no-cors', cache: 'no-store' }).then(() => true, () => false);
  function show(t) {
    current = t.id;
    for (const el of list.children) el.classList.toggle('on', el.dataset.id === t.id);
    for (const id in frames) frames[id].classList.toggle('on', id === t.id);
    wait.style.display = up[t.id] ? 'none' : 'flex';
    if (up[t.id] && !frames[t.id]) {
      const f = document.createElement('iframe'); f.src = t.url; f.className = 'on';
      views.appendChild(f); frames[t.id] = f;
    }
    try { localStorage.setItem('tab', t.id); } catch {}
  }
  for (const t of tabs) {
    const el = document.createElement('div'); el.className = 'tab'; el.dataset.id = t.id;
    el.innerHTML = '<span class="dot"></span>' + t.name; el.onclick = () => show(t);
    list.appendChild(el);
  }
  async function poll() {
    for (const t of tabs) {
      if (up[t.id]) continue;
      if (await alive(t)) {
        up[t.id] = true;
        list.querySelector('[data-id="' + t.id + '"] .dot').classList.add('up');
        if (current === t.id) show(t);
      }
    }
    if (tabs.some((t) => !up[t.id])) setTimeout(poll, 500);
  }
  let first = tabs[0].id; try { first = localStorage.getItem('tab') || first; } catch {}
  show(tabs.find((t) => t.id === first) || tabs[0]);
  poll();
})();
</script>
</body></html>
