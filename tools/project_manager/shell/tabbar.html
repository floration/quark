<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<title>Quark Project</title>
<link rel="stylesheet" href="tabbar.css">
</head>
<body>
<div id="bar">
  <div id="logo" title="Quark Project">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
      <rect x="1" y="1" width="22" height="22" rx="6" fill="#2a63d6"/>
      <circle cx="11.4" cy="11.2" r="5.6" fill="none" stroke="#fff" stroke-width="2.3"/>
      <path d="M14.2 14.3 L18.2 18.4" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    </svg>
  </div>
  <nav id="tabs" role="tablist" aria-label="Tabs"></nav>
  <!-- shown when some tabs do not fit even shortened: their count; click lists them -->
  <button id="more" type="button" hidden></button>
  <div id="fill"></div>
  <div id="err" role="alert" hidden></div>
  <!-- find in page (Ctrl+F): main.js runs findInPage in the active tab -->
  <div id="find" role="search" hidden>
    <input id="find-q" type="text" placeholder="Find in page" spellcheck="false" autocomplete="off" aria-label="Find in page">
    <span id="find-n" aria-live="polite"></span>
    <button id="find-prev" class="icon sm" type="button" title="Previous match (Shift+Enter, Shift+F3)" aria-label="Previous match">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M3.5 10l4.5-4.5 4.5 4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="find-next" class="icon sm" type="button" title="Next match (Enter, F3)" aria-label="Next match">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M3.5 6l4.5 4.5 4.5-4.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="find-close" class="icon sm" type="button" title="Close (Esc)" aria-label="Close find">
      <svg viewBox="0 0 16 16" width="12" height="12" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
  </div>
  <!-- the Editor Manager's facts (tabbar.js fills it from main.js's /api/summary poll; click: open the Editor Manager) -->
  <button id="stats" type="button" hidden></button>
  <button id="zoom" type="button" hidden title="Page zoom of every tab (Ctrl+= / Ctrl+- / Ctrl+mouse wheel). Click: back to 100 %"></button>
  <div id="update" role="status" hidden>
    <span class="msg" title="The Supervisor Board installed a new version of this app (Quark\repository, testing)">Quark Project updated — reopen to finish</span>
    <button id="relaunch" type="button" title="Close and reopen Quark Project with the new version (asks first)">Restart</button>
  </div>
  <button id="reload" class="icon" title="Reload this tab (Ctrl+R, F5). Ctrl+Shift+R reloads the tab list" aria-label="Reload">
    <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M13.2 8a5.2 5.2 0 1 1-1.6-3.75" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M12.2 1.6v3.1H9.1" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <div id="clock" title="Dallas (America/Chicago)"><span class="where">Dallas</span> <span id="time"></span></div>
</div>
<script src="tabbar.js"></script>
</body>
</html>
