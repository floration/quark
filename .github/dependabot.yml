# Keeps the SHA-pinned GitHub Actions in .github/workflows/ current (REVIEW SUP-3): weekly PRs that bump the pin and
# its "# vX" comment. They target the testing branch, like all other work.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: testing
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
