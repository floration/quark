name: build-and-release
on:
  push:
    branches: ['**']
  workflow_dispatch:
permissions:
  contents: write
  pages:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: publish site/ to the gh-pages branch (served at floration.github.io/quark)
        run: |
          python3 tools/site_changelog.py .
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "site for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
