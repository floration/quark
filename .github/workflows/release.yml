# Builds and tests every push. Publishes only from two places (docs: CLAUDE.md "Releases"):
#   TESTING     a push to the `testing` branch: a signed GitHub *prerelease* tagged test-<VERSION>-test.<run number>,
#               built as version <VERSION>-test.<run number> (never "latest"; the website isn't redeployed). The tag
#               must not start with v<digit> or a digit: launchers 0.12-1.16 install the highest such tag even when
#               it's a prerelease. macOS is optional: the prerelease goes out with
#               Windows + Linux, and the macOS files are added when (if) that build finishes.
#   PRODUCTION  a pushed tag v<VERSION> (no suffix) on a commit of the protected default branch: a signed release
#               marked latest, only when Windows, Linux AND macOS all built and passed; then the website.
# Any other push (or a manual run) builds and tests only.
name: build-and-release
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read   # every job only reads; release and pages get write below
env:
  # testing builds carry their own version (<VERSION>-test.<N>: below the production release it leads to)
  QUARK_VERSION_SUFFIX: ${{ github.ref == 'refs/heads/testing' && github.event_name == 'push' && format('-test.{0}', github.run_number) || '' }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a newer push to a work branch replaces its build; a release (testing branch or tag) always runs to the end
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.ref_name != 'testing' }}
jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.c.outputs.channel }}
      version: ${{ steps.c.outputs.version }}   # what the build says it is (testing: <VERSION>-test.<N>)
      base: ${{ steps.c.outputs.base }}         # the VERSION file (changelogs/<base>.md)
      tag: ${{ steps.c.outputs.tag }}
      groups: ${{ steps.g.outputs.groups }}     # quark_tests' groups (JSON): the test matrix, one runner per group
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: c
        name: which channel this run publishes to (production / testing / none)
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -eu
          V=$(head -n1 VERSION | tr -d '[:space:]')
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::VERSION '$V' isn't x.y.z"; exit 1; }
          CHANNEL=none; TAG=""
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
            if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::tag $TAG isn't a production tag (v<x.y.z>, no suffix): nothing is published"; exit 1
            fi
            [ "$TAG" = "v$V" ] || { echo "::error::tag $TAG doesn't match VERSION $V"; exit 1; }
            git fetch -q origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
              echo "::error::$TAG ($GITHUB_SHA) isn't on $DEFAULT_BRANCH: production releases are tagged on the protected default branch"; exit 1
            fi
            CHANNEL=production
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/testing ]; then
            TAG="test-$V$QUARK_VERSION_SUFFIX"
            CHANNEL=testing
            LATEST=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
            NEWEST=$(printf '%s\n%s\n' "${LATEST#v}" "$V" | sort -V | tail -n1)
            if [ -n "$LATEST" ] && { [ "$NEWEST" != "$V" ] || [ "${LATEST#v}" = "$V" ]; }; then
              echo "::warning::VERSION $V isn't newer than production $LATEST: testing launchers may see this build as older (bump VERSION)"
            fi
          fi
          if [ "$CHANNEL" != none ]; then
            [ -f "changelogs/$V.md" ] || { [ "$CHANNEL" = testing ] || { echo "::error::changelogs/$V.md is missing"; exit 1; }; }
            # the full changelog (what changed and why, in depth: the website's updates/<version> page)
            [ -f "changelogs/full/$V.md" ] || { [ "$CHANNEL" = testing ] || { echo "::error::changelogs/full/$V.md is missing"; exit 1; }; }
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::release $TAG already exists: bump VERSION (releases are never replaced)"; exit 1
            fi
          fi
          { echo "channel=$CHANNEL"; echo "version=$V$QUARK_VERSION_SUFFIX"; echo "base=$V"; echo "tag=$TAG"; } >> "$GITHUB_OUTPUT"
          echo "### $CHANNEL ${TAG:-(build only)}" >> "$GITHUB_STEP_SUMMARY"
      - id: g
        name: the test groups (tests/tests.cpp's par + alone lists; the linux job checks the built binary agrees)
        run: |
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json, re
          s = open("tests/tests.cpp").read()
          a = s.index("std::vector<T> par = {")
          b = s.index("#ifndef _WIN32", a)
          names = re.findall(r'^\s*\{"([a-z0-9_]+)", \[\]', s[a:b], re.M)
          assert names, "no test groups found"
          print("groups=" + json.dumps(names))
          PY

  windows:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
      - name: cross-compile (MinGW, static, Windows 7+)
        run: |
          cmake -S . -B build -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc-posix -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++-posix \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres -DCMAKE_BUILD_TYPE=Release \
            -DQUARK_VERSION_SUFFIX="$QUARK_VERSION_SUFFIX"
          cmake --build build -j
          mkdir -p pkg && cp build/quark.exe build/quark_server.exe build/quark_launcher.exe pkg/ && cp -r maps mods pkg/
          python3 tools/pack.py pkg quark-windows.qpak
          mkdir -p quark-windows && cp -r pkg/* README.md quark-windows/
          zip -qr quark-windows.zip quark-windows
          cp build/quark_launcher.exe quark-launcher-windows.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: windows, path: "quark-windows.zip\nquark-windows.qpak\nquark-launcher-windows.exe" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: windows-tests, path: "build/quark_tests.exe\nmaps/*.qmap", retention-days: 7 }   # (maps are generated at build time: not in the checkout)

  windows-tests:   # the release's own MinGW build of the tests, run on Windows (REVIEW ENG-1), one group per runner
    needs: [meta, windows]
    runs-on: windows-2022
    timeout-minutes: 45
    if: needs.meta.outputs.base != '1.17.0'   # 1.17.0 alone ships on its local test run (owner); every later version is tested here
    strategy:
      fail-fast: false   # (every failing group shows up in one run)
      matrix:
        group: ${{ fromJSON(needs.meta.outputs.groups) }}
    name: windows-tests (${{ matrix.group }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: windows-tests, path: . }   # build/quark_tests.exe + maps/
      - name: quark_tests (Windows)
        shell: bash
        env:
          QUARK_SOURCE_DIR: ${{ github.workspace }}   # tools/, assets/ and tests/data/ (the exe was built on another machine)
        run: ./build/quark_tests.exe group "${{ matrix.group }}"

  linux:
    needs: meta
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev
      - env:
          GROUPS: ${{ needs.meta.outputs.groups }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQUARK_VERSION_SUFFIX="$QUARK_VERSION_SUFFIX"
          cmake --build build -j
          # the test matrix (meta's list, read from the source) must be the binary's own groups
          [ "$(build/quark_tests groups | tr '\n' ' ')" = "$(echo "$GROUPS" | python3 -c 'import json,sys; print(" ".join(json.load(sys.stdin)), end=" ")')" ] \
            || { echo "::error::meta's test groups ($GROUPS) aren't quark_tests' own: fix the parser in the meta job"; exit 1; }
          python3 tools/site_changelog.py .   # the website's data builds (checked here, before anything is published)
          python3 tools/site_updates.py . --allow-missing-full   # (work in progress may not have its full changelog yet)
          mkdir -p pkg && cp build/quark build/quark_server build/quark_launcher pkg/ && cp -r maps mods pkg/
          python3 tools/pack.py pkg quark-linux.qpak
          mkdir -p quark-linux && cp -r pkg/* README.md quark-linux/
          tar czf quark-linux.tar.gz quark-linux
          cp build/quark_launcher quark-launcher-linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: linux, path: "quark-linux.tar.gz\nquark-linux.qpak\nquark-launcher-linux" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: linux-tests, path: "build/quark_tests\nmaps/*.qmap", retention-days: 7 }

  linux-tests:   # quark_tests, one group per runner (the slowest group sets the time, and the timing tests run alone)
    needs: [meta, linux]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    if: needs.meta.outputs.base != '1.17.0'   # (as windows-tests)
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.meta.outputs.groups) }}
    name: linux-tests (${{ matrix.group }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: linux-tests, path: . }
      - name: quark_tests
        env:
          QUARK_SOURCE_DIR: ${{ github.workspace }}
        run: |
          chmod +x build/quark_tests
          ./build/quark_tests group "${{ matrix.group }}"

  sanitizers:   # REVIEW ENG-3: work branches only (never a release, and no release job waits for it)
    needs: meta
    if: needs.meta.outputs.channel == 'none' && needs.meta.outputs.base != '1.17.0'   # (1.17.0: no CI tests, owner)
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev
      - name: build with AddressSanitizer + UndefinedBehaviorSanitizer and the libFuzzer harnesses (clang)
        run: |
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -DQUARK_FUZZ=ON -DQUARK_BUILD_CLIENT=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j
      - name: quark_tests under the sanitizers (any report fails it)
        env:
          QUARK_TEST_TIMESCALE: "1"   # real time: sanitized code can't keep the network tests' 4x clock
          UBSAN_OPTIONS: print_stacktrace=1
        run: ./build/quark_tests
      - name: "fuzzers: every saved input (tests/data/fuzz), then 30 s of new ones each"
        working-directory: build   # (fuzz_server loads maps/ from here)
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          for f in packet map rules qpak server; do
            mkdir -p "corpus-$f" && cp ../tests/data/fuzz/$f/* "corpus-$f/"
            ./fuzz_$f -max_total_time=30 -timeout=10 -rss_limit_mb=4096 -artifact_prefix="crash-$f-" "corpus-$f"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with: { name: fuzz-crashes, path: "build/crash-*", retention-days: 7, if-no-files-found: ignore }

  macos:
    needs: meta
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: ${{ needs.meta.outputs.channel != 'production' }}   # required for production only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
            -DQUARK_VERSION_SUFFIX="$QUARK_VERSION_SUFFIX"
          cmake --build build -j
          mkdir -p pkg && cp -r build/quark.app build/quark_server build/quark_launcher pkg/ && cp -r maps pkg/
          mkdir -p pkg/quark.app/Contents/Resources && cp -r maps mods pkg/quark.app/Contents/Resources/
          python3 tools/pack.py pkg quark-macos.qpak
          mkdir -p quark-macos && cp -r pkg/* README.md quark-macos/
          zip -qry quark-macos.zip quark-macos
          zip -j quark-launcher-macos.zip build/quark_launcher
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: macos, path: "quark-macos.zip\nquark-macos.qpak\nquark-launcher-macos.zip" }

  release:   # PRODUCTION: every platform, signed, latest
    needs: [meta, windows, windows-tests, linux, linux-tests, macos]
    # (!cancelled(): the skipped 1.17.0 tests would otherwise skip this too; every other job it needs must have passed)
    if: "!cancelled() && needs.meta.outputs.channel == 'production' && needs.meta.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success' && (needs.windows-tests.result == 'success' || (needs.windows-tests.result == 'skipped' && needs.meta.outputs.base == '1.17.0')) && (needs.linux-tests.result == 'success' || (needs.linux-tests.result == 'skipped' && needs.meta.outputs.base == '1.17.0'))"
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: dist }
      - name: all three platforms are here (no macOS, no release)
        run: |
          rm -rf dist/windows-tests
          for p in windows linux macos; do test -f "dist/$p/quark-$p.qpak" || { echo "::error::no $p build"; exit 1; }; done
      - name: sign the launchers, release manifest, sign every published file (Ed25519, docs/SIGNING.md)
        env:
          QUARK_SIGNING_KEY: ${{ secrets.QUARK_SIGNING_KEY }}
          TAG: ${{ needs.meta.outputs.tag }}
          VER: ${{ needs.meta.outputs.version }}
        run: |
          # B6: everything published from 1.17.0 on is signed. First the launcher inside each package (its .sig goes
          # into the package: the game and the launcher's self-update only use a signed launcher), which changes the
          # packages, so before their hashes are taken. Then the manifest: what servers check before updating
          # (tools/server/autoupdate.sh: this tag is this commit) and the launcher before installing (this release,
          # this channel, these packages' sha256); it names every other download too. Then every file gets a .sig.
          sh tools/sign/sign_release.sh --launchers dist/*/quark-*.qpak
          sh tools/sign/release_manifest.sh production "$TAG" "$VER" "$GITHUB_SHA" dist/*/quark-*.qpak dist/*/quark-launcher-* \
            dist/*/quark-*.zip dist/*/quark-*.tar.gz > dist/quark-release.txt
          sh tools/sign/sign_release.sh dist/*/quark-* dist/quark-release.txt
          (cd dist && sha256sum -- */* quark-release.txt quark-release.txt.sig | sed 's#  [a-z]*/#  #' > SHA256SUMS)
          sh tools/sign/sign_release.sh dist/SHA256SUMS
      - name: publish (marked latest; fails if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VER: ${{ needs.meta.outputs.version }}
        run: |
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "quark $VER" --notes-file "changelogs/$VER.md" \
            dist/windows/* dist/linux/* dist/macos/* dist/quark-release.txt dist/quark-release.txt.sig dist/SHA256SUMS dist/SHA256SUMS.sig

  release-testing:   # TESTING: Windows + Linux, signed prerelease (macOS follows in release-testing-macos)
    needs: [meta, windows, windows-tests, linux, linux-tests]
    if: "!cancelled() && needs.meta.outputs.channel == 'testing' && needs.meta.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success' && (needs.windows-tests.result == 'success' || (needs.windows-tests.result == 'skipped' && needs.meta.outputs.base == '1.17.0')) && (needs.linux-tests.result == 'success' || (needs.linux-tests.result == 'skipped' && needs.meta.outputs.base == '1.17.0'))"
    runs-on: ubuntu-24.04
    environment: testing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: dist }
      - name: sign the launchers, release manifest, sign every published file
        env:
          QUARK_SIGNING_KEY: ${{ secrets.QUARK_SIGNING_KEY }}
          TAG: ${{ needs.meta.outputs.tag }}
          VER: ${{ needs.meta.outputs.version }}
        run: |
          rm -rf dist/windows-tests dist/macos
          # (as in the production job: launcher signatures into the packages first, then the manifest, then every file)
          sh tools/sign/sign_release.sh --launchers dist/*/quark-*.qpak
          sh tools/sign/release_manifest.sh testing "$TAG" "$VER" "$GITHUB_SHA" dist/*/quark-*.qpak dist/*/quark-launcher-* \
            dist/*/quark-*.zip dist/*/quark-*.tar.gz > dist/quark-release.txt
          sh tools/sign/sign_release.sh dist/*/quark-* dist/quark-release.txt
          (cd dist && sha256sum -- */* quark-release.txt quark-release.txt.sig | sed 's#  [a-z]*/#  #' > SHA256SUMS)
          sh tools/sign/sign_release.sh dist/SHA256SUMS
      - name: publish the prerelease (never latest)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VER: ${{ needs.meta.outputs.version }}
          BASE: ${{ needs.meta.outputs.base }}
        run: |
          {
            echo "**Testing build** $VER (\`${GITHUB_SHA::7}\`, branch \`testing\`). Not a production release."
            echo
            if [ -f "changelogs/$BASE.md" ]; then cat "changelogs/$BASE.md"; fi
          } > notes.md
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "quark $VER (testing)" --notes-file notes.md \
            dist/windows/* dist/linux/* dist/quark-release.txt dist/quark-release.txt.sig dist/SHA256SUMS dist/SHA256SUMS.sig

  release-testing-macos:   # adds the macOS files to the testing prerelease when that build succeeded
    needs: [meta, macos, release-testing]
    if: needs.meta.outputs.channel == 'testing' && needs.macos.result == 'success' && needs.release-testing.result == 'success'
    runs-on: ubuntu-24.04
    environment: testing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: dl   # (no artifact when the macOS build failed: then nothing to add, and that's not an error)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with: { name: macos, path: dist/macos }
      - name: sign + upload
        if: steps.dl.outcome == 'success'
        env:
          QUARK_SIGNING_KEY: ${{ secrets.QUARK_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VER: ${{ needs.meta.outputs.version }}
        run: |
          # quark-release.txt went out without this package: its own signed manifest (the launcher prefers it)
          sh tools/sign/sign_release.sh --launchers dist/macos/quark-macos.qpak
          sh tools/sign/release_manifest.sh testing "$TAG" "$VER" "$GITHUB_SHA" dist/macos/quark-macos.qpak dist/macos/quark-launcher-macos.zip \
            dist/macos/quark-macos.zip > dist/macos/quark-release-macos.txt
          sh tools/sign/sign_release.sh dist/macos/quark-*   # (the packages, the launcher, the zip and the manifest)
          (cd dist/macos && sha256sum -- * > SHA256SUMS-macos)
          sh tools/sign/sign_release.sh dist/macos/SHA256SUMS-macos
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" dist/macos/*

  pages:   # the website follows production only
    needs: [meta, release]
    if: needs.meta.outputs.channel == 'production' && needs.release.result == 'success'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: publish site/ to the gh-pages branch (served at floration.github.io/quark), signed
        env:
          GH_TOKEN: ${{ github.token }}
          QUARK_SIGNING_KEY: ${{ secrets.QUARK_SIGNING_KEY }}
        run: |
          python3 tools/site_changelog.py .
          python3 tools/site_updates.py .   # updates/ and updates/<version>/ (every version from 1.17.0 has its full changelog)
          # the owner's website pictures (docs/ASSETS.md): assets/overrides/website/<file> replaces site/img/<file>
          if [ -d assets/overrides/website ]; then find assets/overrides/website -maxdepth 1 -type f \( -name '*.jpg' -o -name '*.png' \) -exec cp {} site/img/ \; ; fi
          # B6: what the site serves is signed too: SHA256SUMS of every file, signed with the release key (the
          # downloads it links are release assets, each with its own .sig). master.txt keeps its own signature,
          # made by the owner (sign-master, docs/SIGNING.md), which is the only one the game reads.
          (cd site && find . -type f ! -name SHA256SUMS ! -name SHA256SUMS.sig | sed 's#^\./##' | LC_ALL=C sort | xargs -d '\n' sha256sum -- > SHA256SUMS)
          sh tools/sign/sign_release.sh site/SHA256SUMS
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "site for ${GITHUB_REF_NAME} (${GITHUB_SHA})"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
