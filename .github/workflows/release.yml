# Builds every push and checks it: meta (VERSION, changelogs, no secrets), the Windows / Linux / macOS builds and
# packages, the website's data, and (work branches and a testing "final test" build: meta's sanitizer trigger) the
# sanitizers + fuzzers, which fail only on memory / undefined-behaviour errors and which no release waits for.
# CI runs no gameplay or UI tests (owner, 2026-10-24): quark_tests and quark --uitest are run locally before every
# push, and the testing build is play-tested by hand (docs/RELEASE_CHECKLIST.md) before production.
# Publishes only from two places (docs: CLAUDE.md "Releases"):
#   TESTING     a push to the `testing` branch: a signed GitHub *prerelease* tagged test-<VERSION>-test.<run number>,
#               built as version <VERSION>-test.<run number> (never "latest"; of the website only the testing
#               channel's asset data, assets/data/testing/, is replaced). The tag
#               must not start with v<digit> or a digit: launchers 0.12-1.16 install the highest such tag even when
#               it's a prerelease. macOS is optional: the prerelease goes out with
#               Windows + Linux, and the macOS files are added when (if) that build finishes.
#   PRODUCTION  a pushed tag v<VERSION> (no suffix) on a commit of the protected default branch: a signed release
#               marked latest, only when Windows, Linux AND macOS all built; then the website.
#   SITE        a manual run on the default branch with "site" ticked: builds, then publishes only the website for the
#               production release VERSION names (which must exist and be latest). For a site deploy that failed or
#               was skipped; it never makes a release.
#   FINAL       a manual run with "final" ticked (meant for `testing`): meta + the sanitizers on the branch's current
#               commit, nothing built or published. A testing push whose head commit message (a merged PR: its title)
#               has [final] runs them too, beside its normal prerelease.
# Any other push (or a manual run) builds and checks only.
name: build-and-release
on:
  push:
    branches: ['**']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      site:
        description: 'Only publish the website again, for the latest production release (run it on the default branch)'
        type: boolean
        default: false
      final:
        description: "Final test: run the sanitizers on this branch's current commit (only meaningful on testing; builds and publishes nothing)"
        type: boolean
        default: false
permissions:
  contents: read   # every job only reads; release and pages get write below
env:
  # testing builds carry their own version (<VERSION>-test.<N>: below the production release it leads to)
  QUARK_VERSION_SUFFIX: ${{ github.ref == 'refs/heads/testing' && github.event_name == 'push' && format('-test.{0}', github.run_number) || '' }}
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # a newer push to a work branch replaces its build; a release (testing branch or tag) always runs to the end
  cancel-in-progress: ${{ github.ref_type == 'branch' && github.ref_name != 'testing' }}
jobs:
  meta:
    runs-on: ubuntu-24.04
    outputs:
      channel: ${{ steps.c.outputs.channel }}
      version: ${{ steps.c.outputs.version }}   # what the build says it is (testing: <VERSION>-test.<N>)
      base: ${{ steps.c.outputs.base }}         # the VERSION file (changelogs/<base>.md)
      tag: ${{ steps.c.outputs.tag }}
      sanitizers: ${{ steps.c.outputs.sanitizers }}   # 'true': the sanitizers job runs (the trigger is in step c)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: c
        name: which channel this run publishes to (production / testing / site / final / none), and if the sanitizers run
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SITE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.site || false }}
          FINAL_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.final || false }}
          HEAD_MSG: ${{ github.event.head_commit.message }}   # (a push's head commit; empty on a manual run)
        run: |
          set -eu
          V=$(head -n1 VERSION | tr -d '[:space:]')
          echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::VERSION '$V' isn't x.y.z"; exit 1; }
          if [ "$SITE_ONLY" = true ] && [ "$FINAL_ONLY" = true ]; then echo "::error::tick site or final, not both"; exit 1; fi
          CHANNEL=none; TAG=""
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            TAG="$GITHUB_REF_NAME"
            if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::tag $TAG isn't a production tag (v<x.y.z>, no suffix): nothing is published"; exit 1
            fi
            [ "$TAG" = "v$V" ] || { echo "::error::tag $TAG doesn't match VERSION $V"; exit 1; }
            git fetch -q origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
              echo "::error::$TAG ($GITHUB_SHA) isn't on $DEFAULT_BRANCH: production releases are tagged on the protected default branch"; exit 1
            fi
            CHANNEL=production
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/testing ]; then
            TAG="test-$V$QUARK_VERSION_SUFFIX"
            CHANNEL=testing
            LATEST=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
            NEWEST=$(printf '%s\n%s\n' "${LATEST#v}" "$V" | sort -V | tail -n1)
            if [ -n "$LATEST" ] && { [ "$NEWEST" != "$V" ] || [ "${LATEST#v}" = "$V" ]; }; then
              echo "::warning::VERSION $V isn't newer than production $LATEST: testing launchers may see this build as older (bump VERSION)"
            fi
          elif [ "$SITE_ONLY" = true ]; then
            [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ] || { echo "::error::a site-only run publishes the default branch's site: run it on $DEFAULT_BRANCH"; exit 1; }
            LATEST=$(gh release view -R "$GITHUB_REPOSITORY" --json tagName -q .tagName 2>/dev/null || true)
            [ "$LATEST" = "v$V" ] || { echo "::error::VERSION $V isn't the latest production release ($LATEST): nothing to publish the site for"; exit 1; }
            TAG="v$V"; CHANNEL=site
          elif [ "$FINAL_ONLY" = true ]; then
            CHANNEL=final   # (the build, package and publish jobs skip on a final run: only meta and the sanitizers)
          fi
          if [ "$CHANNEL" = production ] || [ "$CHANNEL" = testing ]; then
            [ -f "changelogs/$V.md" ] || { [ "$CHANNEL" = testing ] || { echo "::error::changelogs/$V.md is missing"; exit 1; }; }
            # the full changelog (what changed and why, in depth: the website's updates/<version> page)
            [ -f "changelogs/full/$V.md" ] || { [ "$CHANNEL" = testing ] || { echo "::error::changelogs/full/$V.md is missing"; exit 1; }; }
            if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::release $TAG already exists: bump VERSION (releases are never replaced)"; exit 1
            fi
          fi
          # When the sanitizers run (owner, 2026-10-24); this is the one place to change it. Nothing waits for them.
          #   work branches (and a plain manual run): every time
          #   testing: only for a "final test" build, the one meant for production (docs/RELEASE_CHECKLIST.md section 0):
          #     (1) a push whose head commit message has [final] (a merged PR's commit carries the PR title), or
          #     (2) a manual run with "final" ticked (channel final)
          #     (to keep only one of the two: delete the line for the other, and for (2) the `final` input above)
          #   production tags (that commit ran them on testing) and site-only runs: never
          SANITIZERS=false
          case "$CHANNEL" in
            none) SANITIZERS=true ;;
            final) SANITIZERS=true ;;                                           # (2)
            testing) case "$HEAD_MSG" in *'[final]'*) SANITIZERS=true ;; esac ;;  # (1)
          esac
          { echo "channel=$CHANNEL"; echo "version=$V$QUARK_VERSION_SUFFIX"; echo "base=$V"; echo "tag=$TAG"; echo "sanitizers=$SANITIZERS"; } >> "$GITHUB_OUTPUT"
          echo "### $CHANNEL ${TAG:-(build only)}$([ "$SANITIZERS" = true ] && echo ', sanitizers')" >> "$GITHUB_STEP_SUMMARY"
      - name: no keys, tokens or secrets in the repository (tools/check_secrets.py; the pre-commit hook runs it too)
        run: python3 -I tools/check_secrets.py
      - name: the asset provenance registry is valid (tools/provenance.py check, docs/PROVENANCE.md)
        run: python3 -I tools/provenance.py check

  lightcache:   # the official maps' light (quark --bake-maps), baked once and shipped in every package's maps/lightcache/
    # so no first join waits for a bake (Midtown ~5 s). Linux only: the Windows exe is cross-compiled and can't run here.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.final) }}   # (as windows)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev
      - name: build the game, bake every embedded map (no window, every core), zlib them for the packages
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQUARK_BUILD_TESTS=OFF
          cmake --build build -j --target quark
          build/quark --bake-maps bake
          python3 tools/pack_lightcache.py bake lightcache   # (~84 MB raw, ~12 MB as shipped: packages aren't compressed)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: lightcache, path: lightcache, retention-days: 7 }   # (the packaging jobs put it in their packages)

  windows:
    needs: lightcache
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.final) }}   # (a final run builds nothing: meta + sanitizers only)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: lightcache, path: lightcache }
      - name: MinGW (x86-64, posix threads; apt retries a stalled mirror download instead of hanging)
        timeout-minutes: 15
        run: |
          # (2026-10-23: downloads from the runner's default Azure mirror stalled for good; use Ubuntu's own)
          sudo sed -i 's#azure\.archive\.ubuntu\.com#archive.ubuntu.com#g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/*.sources 2>/dev/null || true
          APT="-o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 -o Acquire::Retries=5"
          sudo apt-get $APT update
          sudo apt-get $APT install -y --no-install-recommends g++-mingw-w64-x86-64-posix gcc-mingw-w64-x86-64-posix binutils-mingw-w64-x86-64
      - name: cross-compile (MinGW, static, Windows 7+)
        run: |
          cmake -S . -B build -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc-posix -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++-posix \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres -DCMAKE_BUILD_TYPE=Release \
            -DQUARK_VERSION_SUFFIX="$QUARK_VERSION_SUFFIX"
          cmake --build build -j   # (every target: quark_tests.exe too, so a MinGW-only compile error in the tests shows here)
          sh tools/launcher_build.sh -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc-posix -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++-posix \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres -DCMAKE_BUILD_TYPE=Release
          mkdir -p pkg && cp build/quark.exe build/quark_server.exe build-launcher/quark_launcher.exe pkg/ && cp -r maps mods pkg/
          cp -r lightcache pkg/maps/lightcache && sh tools/check_lightcache.sh build pkg/maps/lightcache
          python3 tools/pack.py pkg quark-windows.qpak
          mkdir -p quark-windows && cp -r pkg/* README.md quark-windows/
          zip -qr quark-windows.zip quark-windows
          cp build-launcher/quark_launcher.exe quark-launcher-windows.exe
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: windows, path: "quark-windows.zip\nquark-windows.qpak\nquark-launcher-windows.exe" }

  linux:
    needs: lightcache
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.final) }}   # (as windows)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: lightcache, path: lightcache }
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libgl-dev
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false, ref: site, path: site }   # the website's source: the site branch (HANDOVER section 4)
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DQUARK_VERSION_SUFFIX="$QUARK_VERSION_SUFFIX"
          cmake --build build -j
          python3 tools/site_changelog.py .   # the website's data builds (checked here, before anything is published)
          python3 tools/site_updates.py . --allow-missing-full   # (work in progress may not have its full changelog yet)
          # the website's assets/ and sounds/ pages: this build's models, maps, sounds and voices (docs/ASSETS.md)
          build/quark_tests exportassets build/assets_export > /dev/null
          python3 tools/studio/build.py build/assets_export
          python3 tools/site_assets.py --studio build/studio --out site-assets
          sh tools/launcher_build.sh -DCMAKE_BUILD_TYPE=Release
          mkdir -p pkg && cp build/quark build/quark_server build-launcher/quark_launcher pkg/ && cp -r maps mods pkg/
          cp -r lightcache pkg/maps/lightcache && sh tools/check_lightcache.sh build pkg/maps/lightcache
          python3 tools/pack.py pkg quark-linux.qpak
          mkdir -p quark-linux && cp -r pkg/* README.md quark-linux/
          tar czf quark-linux.tar.gz quark-linux
          cp build-launcher/quark_launcher quark-launcher-linux
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: linux, path: "quark-linux.tar.gz\nquark-linux.qpak\nquark-launcher-linux" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: site-assets, path: site-assets, retention-days: 7 }   # (the pages / release-testing jobs publish it)

  sanitizers:   # REVIEW ENG-3: a memory / undefined-behaviour check, not a gameplay test (those run locally before a push).
    # quark_tests only drives the code here: the job fails on a sanitizer report or a fuzzer crash, never on a test's own
    # CHECK. When it runs is meta's sanitizer trigger (work branches; on testing a "final test" build only; never a
    # production tag or a site-only run), and no release job waits for it (owner, 2026-10-24).
    needs: meta
    if: needs.meta.outputs.sanitizers == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y clang-18 libclang-rt-18-dev
      - name: build with AddressSanitizer + UndefinedBehaviorSanitizer and the libFuzzer harnesses (clang)
        run: |
          CC=clang-18 CXX=clang++-18 cmake -S . -B build -DQUARK_FUZZ=ON -DQUARK_BUILD_CLIENT=OFF -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -j
      - name: quark_tests under the sanitizers (fails only on a sanitizer report; the tests' own results don't count here)
        env:
          QUARK_TEST_TIMESCALE: "1"   # real time: sanitized code can't keep the network tests' 4x clock
        run: |
          # Every ASan / LSan / UBSan report goes to its own file, <log_path>.<pid>: the forked test groups' too (the
          # runtime reopens the file per pid), including a crash it catches in one. -fno-sanitize-recover=all
          # (CMakeLists QUARK_SANITIZE) makes any UB report fatal, so it's always written before the process ends.
          SAN="$RUNNER_TEMP/san"; mkdir -p "$SAN"
          export ASAN_OPTIONS="log_path=$SAN/report" UBSAN_OPTIONS="log_path=$SAN/report:print_stacktrace=1"
          # (a hang isn't a sanitizer finding: timeout stops the whole process group, and the reports are still read)
          rc=0; timeout -k 1m 55m ./build/quark_tests || rc=$?
          shopt -s nullglob; reports=("$SAN"/report.*)
          for f in "${reports[@]}"; do echo "::group::sanitizer output: $f"; cat "$f"; echo "::endgroup::"; done
          if [ ${#reports[@]} -gt 0 ] && grep -qE 'ERROR: |runtime error:|SUMMARY: ' "${reports[@]}"; then
            echo "::error::the sanitizers reported an error (above; the files are the sanitizer-reports artifact)"; exit 1
          fi
          [ ${#reports[@]} -eq 0 ] || echo "::warning::sanitizer warnings, no errors (above)"
          echo "::notice::no sanitizer errors. quark_tests itself exited $rc$([ "$rc" = 124 ] && echo ' (timed out)') under the sanitizers: not counted here (gameplay tests run locally before a push)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with: { name: sanitizer-reports, path: "${{ runner.temp }}/san/", retention-days: 7, if-no-files-found: ignore }
      - name: "fuzzers: every saved input (tests/data/fuzz), then 30 s of new ones each"
        working-directory: build   # (fuzz_server loads maps/ from here)
        env:
          UBSAN_OPTIONS: print_stacktrace=1
        run: |
          for f in packet map rules qpak server; do
            mkdir -p "corpus-$f" && cp ../tests/data/fuzz/$f/* "corpus-$f/"
            ./fuzz_$f -max_total_time=30 -timeout=10 -rss_limit_mb=4096 -artifact_prefix="crash-$f-" "corpus-$f"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with: { name: fuzz-crashes, path: "build/crash-*", retention-days: 7, if-no-files-found: ignore }

  macos:
    needs: [meta, lightcache]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.final) }}   # (as windows)
    runs-on: macos-latest
    timeout-minutes: 60
    continue-on-error: ${{ needs.meta.outputs.channel != 'production' }}   # required for production only
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: lightcache, path: lightcache }
      - run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
            -DQUARK_VERSION_SUFFIX="$QUARK_VERSION_SUFFIX"
          cmake --build build -j
          sh tools/launcher_build.sh -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15
          mkdir -p pkg && cp -r build/quark.app build/quark_server build-launcher/quark_launcher pkg/ && cp -r maps pkg/
          mkdir -p pkg/quark.app/Contents/Resources && cp -r maps mods pkg/quark.app/Contents/Resources/
          # (the bakes only where the game reads its maps: pkg/maps is the dedicated server's, which draws nothing)
          cp -r lightcache pkg/quark.app/Contents/Resources/maps/lightcache && sh tools/check_lightcache.sh build pkg/quark.app/Contents/Resources/maps/lightcache
          python3 tools/pack.py pkg quark-macos.qpak
          mkdir -p quark-macos && cp -r pkg/* README.md quark-macos/
          zip -qry quark-macos.zip quark-macos
          zip -j quark-launcher-macos.zip build-launcher/quark_launcher
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with: { name: macos, path: "quark-macos.zip\nquark-macos.qpak\nquark-launcher-macos.zip" }

  macos-watchdog:   # GitHub often has no macOS runner free: then the macos job waits in the queue for hours and holds the
    # run (and the next testing push behind it). After 5 min queued, once every other job has finished, this cancels the
    # run, skipping only the macOS part (the testing prerelease is out by then; production waits for macOS as always), and
    # macos-retry.yml re-runs the cancelled macOS part (and what needs it) an hour later. Owner's call, 2026-10-23.
    # (The sanitizers, when they run, are one of those other jobs: the cancel waits for them to finish.)
    needs: meta
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.final) }}   # (no macos job on a final run)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      actions: write   # (to cancel this run; nothing else)
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -u
          start=$(date +%s); idle=0
          while :; do
            sleep 60
            jobs=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/attempts/$ATTEMPT/jobs?per_page=100" --jq .jobs) || continue
            mac=$(echo "$jobs" | jq -r '[.[] | select(.name == "macos")][0].status // "none"')
            case "$mac" in in_progress|completed|none) echo "macos: $mac"; exit 0;; esac
            # (jobs that need macos aren't created yet; ask for 3 idle minutes in a row: a job that needs another is
            # created a few seconds after that one ends)
            busy=$(echo "$jobs" | jq '[.[] | select(.name != "macos" and .name != "macos-watchdog" and .status != "completed")] | length')
            if [ "$busy" = 0 ]; then idle=$((idle + 1)); else idle=0; fi
            if [ $(( $(date +%s) - start )) -ge 300 ] && [ "$idle" -ge 3 ]; then
              echo "::warning::no macOS runner in 5 min: skipping macOS (cancelling the run); macos-retry.yml re-runs it in about an hour"
              gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/cancel"
              exit 0
            fi
          done

  release:   # PRODUCTION: every platform, signed, latest
    needs: [meta, windows, linux, macos]
    # (no status function: GitHub's implicit success() also requires every job above to have passed; none of them is
    # ever skipped on a production run)
    if: needs.meta.outputs.channel == 'production' && needs.meta.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: dist }
      - name: all three platforms are here (no macOS, no release)
        run: |
          # only the platforms' artifacts are release files: drop every other one (the website's assets, which the pages
          # job publishes, and any a check job uploaded), or `sha256sum */*` below would list them
          find dist -mindepth 1 -maxdepth 1 ! -name windows ! -name linux ! -name macos -exec rm -rf {} +
          for p in windows linux macos; do test -f "dist/$p/quark-$p.qpak" || { echo "::error::no $p build"; exit 1; }; done
      - name: sign the launchers, release manifest, sign every published file (Ed25519, docs/SIGNING.md)
        env:
          QUARK_SIGNING_KEY: ${{ secrets.QUARK_SIGNING_KEY }}
          TAG: ${{ needs.meta.outputs.tag }}
          VER: ${{ needs.meta.outputs.version }}
        run: |
          # B6: everything published from 1.17.0 on is signed. First the launcher inside each package (its .sig goes
          # into the package: the game and the launcher's self-update only use a signed launcher), which changes the
          # packages, so before their hashes are taken. Then the manifest: what servers check before updating
          # (tools/server/autoupdate.sh: this tag is this commit) and the launcher before installing (this release,
          # this channel, these packages' sha256); it names every other download too. Then every file gets a .sig.
          sh tools/sign/sign_release.sh --launchers dist/*/quark-*.qpak
          sh tools/sign/release_manifest.sh production "$TAG" "$VER" "$GITHUB_SHA" dist/*/quark-*.qpak dist/*/quark-launcher-* \
            dist/*/quark-*.zip dist/*/quark-*.tar.gz > dist/quark-release.txt
          sh tools/sign/sign_release.sh dist/*/quark-* dist/quark-release.txt
          (cd dist && sha256sum -- */* quark-release.txt quark-release.txt.sig | sed 's#  [a-z]*/#  #' > SHA256SUMS)
          sh tools/sign/sign_release.sh dist/SHA256SUMS
      - name: publish (marked latest; fails if it already exists)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VER: ${{ needs.meta.outputs.version }}
        run: |
          { cat "changelogs/$VER.md"; echo; python3 -I tools/provenance.py summary --markdown; } > notes.md   # (+ the human-made line)
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "quark $VER" --notes-file notes.md \
            dist/windows/* dist/linux/* dist/macos/* dist/quark-release.txt dist/quark-release.txt.sig dist/SHA256SUMS dist/SHA256SUMS.sig

  release-testing:   # TESTING: Windows + Linux, signed prerelease (macOS follows in release-testing-macos)
    needs: [meta, windows, linux]
    if: needs.meta.outputs.channel == 'testing' && needs.meta.result == 'success' && needs.windows.result == 'success' && needs.linux.result == 'success'   # (as release)
    runs-on: ubuntu-24.04
    environment: testing
    permissions:
      contents: write
    concurrency: { group: gh-pages, cancel-in-progress: false }   # (it and pages both rewrite gh-pages: one at a time)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { path: dist }
      - name: sign the launchers, release manifest, sign every published file
        env:
          QUARK_SIGNING_KEY: ${{ secrets.QUARK_SIGNING_KEY }}
          TAG: ${{ needs.meta.outputs.tag }}
          VER: ${{ needs.meta.outputs.version }}
        run: |
          # only Windows + Linux (as the production job: no other artifact, e.g. the website's assets, which the last step
          # publishes, or a sanitizer / fuzzer report uploaded by then; macOS: release-testing-macos adds it)
          find dist -mindepth 1 -maxdepth 1 ! -name windows ! -name linux -exec rm -rf {} +
          # (as in the production job: launcher signatures into the packages first, then the manifest, then every file)
          sh tools/sign/sign_release.sh --launchers dist/*/quark-*.qpak
          sh tools/sign/release_manifest.sh testing "$TAG" "$VER" "$GITHUB_SHA" dist/*/quark-*.qpak dist/*/quark-launcher-* \
            dist/*/quark-*.zip dist/*/quark-*.tar.gz > dist/quark-release.txt
          sh tools/sign/sign_release.sh dist/*/quark-* dist/quark-release.txt
          (cd dist && sha256sum -- */* quark-release.txt quark-release.txt.sig | sed 's#  [a-z]*/#  #' > SHA256SUMS)
          sh tools/sign/sign_release.sh dist/SHA256SUMS
      - name: publish the prerelease (never latest)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VER: ${{ needs.meta.outputs.version }}
          BASE: ${{ needs.meta.outputs.base }}
        run: |
          {
            echo "**Testing build** $VER (\`${GITHUB_SHA::7}\`, branch \`testing\`). Not a production release."
            echo
            if [ -f "changelogs/$BASE.md" ]; then cat "changelogs/$BASE.md"; fi
            echo
            python3 -I tools/provenance.py summary --markdown   # (how much is human-made: docs/PROVENANCE.md)
          } > notes.md
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --latest=false \
            --title "quark $VER (testing)" --notes-file notes.md \
            dist/windows/* dist/linux/* dist/quark-release.txt dist/quark-release.txt.sig dist/SHA256SUMS dist/SHA256SUMS.sig
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: site-assets, path: site-assets }
      - name: the website's TESTING assets (assets/data/testing/ on gh-pages; everything else as production left it), signed
        env:
          GH_TOKEN: ${{ github.token }}
          QUARK_SIGNING_KEY: ${{ secrets.QUARK_SIGNING_KEY }}
          VER: ${{ needs.meta.outputs.version }}
        run: |
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rc=0; git ls-remote --exit-code --heads "$URL" gh-pages > /dev/null || rc=$?
          if [ "$rc" = 2 ]; then echo "::notice::no gh-pages yet (the first production release publishes the site): testing assets not published"; exit 0; fi
          [ "$rc" = 0 ] || { echo "::error::can't read the gh-pages branch"; exit 1; }
          rm -rf site
          git clone -q --depth 1 -b gh-pages "$URL" site
          rm -rf site/.git site/assets/data/testing site/SHA256SUMS site/SHA256SUMS.sig
          mkdir -p site/assets/data
          cp -r site-assets site/assets/data/testing
          # B6, as the pages job: a signed SHA256SUMS of every file the site serves (now with these assets)
          (cd site && find . -type f ! -name SHA256SUMS ! -name SHA256SUMS.sig ! -name .nojekyll | sed 's#^\./##' | LC_ALL=C sort | xargs -d '\n' sha256sum -- > SHA256SUMS)
          sh tools/sign/sign_release.sh site/SHA256SUMS
          cd site
          touch .nojekyll
          git init -q -b gh-pages   # (one commit, as the pages job leaves it: the branch doesn't grow with every testing build)
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "testing assets for ${VER} (${GITHUB_SHA})"
          git push -qf "$URL" gh-pages

  release-testing-macos:   # adds the macOS files to the testing prerelease when that build succeeded
    needs: [meta, macos, release-testing]
    if: "!cancelled() && needs.meta.outputs.channel == 'testing' && needs.macos.result == 'success' && needs.release-testing.result == 'success'"
    runs-on: ubuntu-24.04
    environment: testing
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: dl   # (no artifact when the macOS build failed: then nothing to add, and that's not an error)
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with: { name: macos, path: dist/macos }
      - name: sign + upload
        if: steps.dl.outcome == 'success'
        env:
          QUARK_SIGNING_KEY: ${{ secrets.QUARK_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.meta.outputs.tag }}
          VER: ${{ needs.meta.outputs.version }}
        run: |
          # quark-release.txt went out without this package: its own signed manifest (the launcher prefers it)
          sh tools/sign/sign_release.sh --launchers dist/macos/quark-macos.qpak
          sh tools/sign/release_manifest.sh testing "$TAG" "$VER" "$GITHUB_SHA" dist/macos/quark-macos.qpak dist/macos/quark-launcher-macos.zip \
            dist/macos/quark-macos.zip > dist/macos/quark-release-macos.txt
          sh tools/sign/sign_release.sh dist/macos/quark-*   # (the packages, the launcher, the zip and the manifest)
          (cd dist/macos && sha256sum -- * > SHA256SUMS-macos)
          sh tools/sign/sign_release.sh dist/macos/SHA256SUMS-macos
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" dist/macos/*

  pages:   # the website follows production only (or a site-only run: SITE above)
    needs: [meta, linux, release]   # linux: its site-assets export (a site-only run has no release job to wait on it)
    # !cancelled(): a site-only run skips release, and without it GitHub's implicit success() would skip this job too
    if: "!cancelled() && needs.meta.result == 'success' && needs.linux.result == 'success' && ((needs.meta.outputs.channel == 'production' && needs.release.result == 'success') || needs.meta.outputs.channel == 'site')"
    runs-on: ubuntu-24.04
    environment: production
    permissions:
      contents: write
    concurrency: { group: gh-pages, cancel-in-progress: false }   # (as release-testing)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { persist-credentials: false, ref: site, path: site }   # the website's source: the site branch (HANDOVER section 4)
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with: { name: site-assets, path: site/assets/data/production }   # (the linux job's export of this release)
      - name: publish site/ to the gh-pages branch (served at floration.github.io/quark), signed
        env:
          GH_TOKEN: ${{ github.token }}
          QUARK_SIGNING_KEY: ${{ secrets.QUARK_SIGNING_KEY }}
        run: |
          rm -rf site/.git   # (the site branch's checkout: not published, and gh-pages is a fresh one-commit branch below)
          python3 tools/site_changelog.py .
          python3 tools/site_updates.py .   # updates/ and updates/<version>/ (every version from 1.17.0 has its full changelog)
          # the owner's website pictures (docs/ASSETS.md): assets/overrides/website/<file> replaces site/img/<file>
          if [ -d assets/overrides/website ]; then find assets/overrides/website -maxdepth 1 -type f \( -name '*.jpg' -o -name '*.png' \) -exec cp {} site/img/ \; ; fi
          # the TESTING channel's assets stay as the last testing build published them (release-testing writes them)
          URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          rc=0; git ls-remote --exit-code --heads "$URL" gh-pages > /dev/null || rc=$?
          if [ "$rc" = 0 ]; then
            git clone -q --depth 1 -b gh-pages "$URL" "$RUNNER_TEMP/gh-pages"
            if [ -d "$RUNNER_TEMP/gh-pages/assets/data/testing" ]; then mkdir -p site/assets/data && cp -r "$RUNNER_TEMP/gh-pages/assets/data/testing" site/assets/data/testing; fi
            rm -rf "$RUNNER_TEMP/gh-pages"
          elif [ "$rc" != 2 ]; then echo "::error::can't read the gh-pages branch"; exit 1; fi
          # B6: what the site serves is signed too: SHA256SUMS of every file, signed with the release key (the
          # downloads it links are release assets, each with its own .sig). master.txt keeps its own signature,
          # made by the owner (sign-master, docs/SIGNING.md), which is the only one the game reads.
          (cd site && find . -type f ! -name SHA256SUMS ! -name SHA256SUMS.sig | sed 's#^\./##' | LC_ALL=C sort | xargs -d '\n' sha256sum -- > SHA256SUMS)
          sh tools/sign/sign_release.sh site/SHA256SUMS
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "site for ${GITHUB_REF_NAME} (${GITHUB_SHA})"
          git push -qf "$URL" gh-pages

  deploy-worker:   # the ranking server, after a production release (docs/OPERATIONS.md "Cloudflare"). Off until the
                   # repository variable DEPLOY_WORKER is "true" and the secrets / variables below are set.
    needs: [meta, release]
    if: "!cancelled() && needs.meta.outputs.channel == 'production' && needs.release.result == 'success' && vars.DEPLOY_WORKER == 'true'"
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: D1 migrations, then the worker (tools/master/deploy.sh)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          QUARK_D1_ID: ${{ vars.QUARK_D1_ID }}
          QUARK_WORKER_COMPAT_DATE: ${{ vars.QUARK_WORKER_COMPAT_DATE }}
        run: sh tools/master/deploy.sh
