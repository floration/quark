# Re-runs the macOS part of a build-and-release run that release.yml's macos-watchdog skipped because no macOS runner
# was free (often the case): about an hour after the skip, then every hour until a runner takes it, for up to two days
# (24 attempts). Re-running the run's failed jobs re-runs only the cancelled ones (macos, the watchdog, and whatever
# waits on macos: the testing prerelease's macOS files, or the production release); jobs that passed are kept.
# Scheduled workflows run from the default branch: this starts once it's there.
name: macos-retry
on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:
permissions:
  actions: write   # (to re-run build-and-release runs; nothing else)
jobs:
  retry:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          now=$(date +%s)
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?status=cancelled&per_page=50" \
            --jq '.workflow_runs[] | [.id, .run_attempt, .updated_at, .head_branch, .head_sha] | @tsv' |
          while IFS="$(printf '\t')" read -r id attempt updated branch sha; do
            age=$(( now - $(date -d "$updated" +%s) ))
            [ "$age" -ge 3300 ] && [ "$age" -le 172800 ] && [ "$attempt" -lt 24 ] || continue
            # only a skip: the macos job cancelled before any runner took it (no steps ran), not a cancelled push
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/attempts/$attempt/jobs?per_page=100" \
              --jq '[.jobs[] | select(.name == "macos" and .conclusion == "cancelled" and (.steps | length) == 0)] | length') || continue
            [ "$n" = 1 ] || continue
            # and only the newest run of its branch or tag (an older commit's macOS build is moot)
            newest=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?branch=$branch&per_page=1" --jq '.workflow_runs[0].id') || continue
            [ "$newest" = "$id" ] || { echo "run $id ($branch): a newer run exists, not retrying"; continue; }
            echo "re-running the macOS part of run $id ($branch ${sha%"${sha#???????}"}, attempt $attempt)"
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/rerun-failed-jobs" || echo "::warning::re-run of $id refused"
          done
